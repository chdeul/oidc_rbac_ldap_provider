annuary:
  users: |
    SELECT 
      id as Uid,
      ident as Identifiant, 
      name as NomComplet, 
      email as AdresseMail, 
      roles as Roles 
    FROM public.users 
    WHERE ident like $1
  group: |
    SELECT 
      uid as Uid,
      ident as Identifiant, 
      name as NomComplet, 
      email as AdresseMail, 
      roles as Roles  
    FROM public.users 
    WHERE POSITION($1 IN roles) > 0
