routes:  
  - source:
      method: GET
      path : users/{id}
    target:
    - method: GET
      url: http://localhost:8080/agrem/csv/users/{id}       
      header: 
        PRIVATE_TOKEN: Good
      jsscript: "data/restApi.js"
      maparray: ""
      mapobject:
        Uid: "Uid"
        Identifiant: "Identifiant"
        NomComplet: "NomComplet"
        AdresseMail: "AdresseMail"
        Roles: "Roles"
  - source:
      method: GET
      path : group/{id}
    target:
    - method: GET
      url: http://localhost:8080/agrem/csv/group/{id}       
      header: 
        PRIVATE_TOKEN: Good
      maparray: ""
      mapobject:
        Uid: "Uid"
        Identifiant: "Identifiant"
        NomComplet: "NomComplet"
        AdresseMail: "AdresseMail"
        Roles: "Roles"


