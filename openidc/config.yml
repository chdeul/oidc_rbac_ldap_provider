### Fichier de configuration -Test ###

 #  Web UI, SSO
server:
  port: 8008   

# client openid connect
openidc:
  client:
    issuer:     "https://oidctest.wsweet.org/" # .well-known/openid-configuration
    ident:      "private" 
    secret:     "tardis"
    serverurl:  "http://localhost:8008"
    callbackpath: "/openidc/callback"
    scope:      [ "openid", "profile", "email", "roles" ]
    authmethod: "query"  # or fragment or form_post 
    uidfield:   "sub"    # or uid or preferred_username
